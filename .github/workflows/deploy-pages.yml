name: Deploy to GitHub Pages

# v54.324：自动把最新 release 部署到 GitHub Pages
#
# 触发：
#   - push 到 main（当 release/ 或 tools/ 变化时）
#   - 手动触发（workflow_dispatch）
#
# 部署内容：deploy/ 目录（由 tools/build_github_pages.py 生成）

on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'tools/build_github_pages.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate deploy package
        run: python tools/build_github_pages.py

      - name: Add CNAME (custom domain, optional)
        run: |
          if [ -f CNAME ]; then cp CNAME deploy/CNAME; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
